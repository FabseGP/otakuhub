[package]
name = "otakuhub"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { version = "*", optional = true }
axum = { version = "*", features = ["macros"], optional = true }
console_error_panic_hook = { version = "*", optional = true }
leptos = { version = "*", features = ["nightly"] }
leptos_axum = { version = "*", optional = true }
leptos_meta = "*"
leptos_router = { version = "*", features = ["nightly"] }
opentelemetry = { version = "*", optional = true }
opentelemetry-otlp = { version = "*", default-features = false, features = ["grpc-tonic", "trace"], optional = true }
opentelemetry_sdk = { version = "*", default-features = false, features = ["rt-tokio", "trace"], optional = true }
serde = { version = "*", optional = true }
thiserror = { version = "*", optional = true }
tokio = { version = "*", features = ["rt-multi-thread", "signal"], optional = true }
toml = { version = "*", optional = true }
tracing = { version = "*", optional = true }
tracing-opentelemetry = { version = "*", default-features = false, optional = true }
tracing-subscriber = { version = "*", optional = true }
wasm-bindgen = { version = "*", optional = true }

[features]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:console_error_panic_hook"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:anyhow",
    "dep:axum",
    "dep:leptos_axum",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:serde",
    "dep:thiserror",
    "dep:tokio",
    "dep:toml",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
]

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

[profile.dev]
strip = true
panic = "abort"

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "otakuhub"

# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"

# The tailwind input file.
#
# Optional, Activates the tailwind build
tailwind-input-file = "style/tailwind.css"

# The tailwind config file.
#
# Optional, defaults to "tailwind.config.js" which if is not present
# is generated for you
tailwind-config-file = "tailwind.config.js"

# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
assets-dir = "public"

# The ip and port for the server to be hosted at
site-addr = "127.0.0.1:9999"

# The port to use for automatic reload monitoring
reload-port = 3001

# [Optional] Command to use when running end2end tests. It will run in the end2end dir.
#   [Windows] for non-WSL use "npx.cmd playwright test"
#   This binary name can be checked in Powershell with Get-Command npx
end2end-cmd = "pnpm exec playwright test"
end2end-dir = "end2end"

#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "PROD"

# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = true

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = true

# The profile to use for the lib target when compiling for release
#
# Optional. Defaults to "release".
lib-profile-release = "wasm-release"

# Enabling wasm-opt features
#
# Optional. By default, "-Oz" and "--enable-bulk-memory" are used. For all features, consult `wasm-opt --help`.
# By providing features, you will override the default enabled features.
wasm-opt-features = ["-Oz","--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lints.clippy]
all = "warn"
nursery = "warn"
pedantic = "warn"
absolute_paths = "warn"
allow_attributes = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
error_impl_error = "warn"
expect_used = "warn"
field_scoped_visibility_modifiers = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
large_include_file = "warn"
mod_module_files = "warn"
panic = "warn"
panic_in_result_fn = "warn"
print_stdout = "warn"
redundant_type_annotations = "warn"
return_and_then = "warn"
str_to_string = "warn"
string_to_string = "warn"
unneeded_field_pattern = "warn"
verbose_file_reads = "warn"
use_debug = "warn"
unwrap_used = "warn"
unwrap_in_result = "warn"
unused_trait_names = "warn"
unused_result_ok = "warn"
